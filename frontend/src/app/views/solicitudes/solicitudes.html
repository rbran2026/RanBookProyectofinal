<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Gestión de Solicitudes</h2>
      <p class="text-muted">Revisa y administra las solicitudes de la comunidad</p>
    </div>
    <button class="btn btn-success fw-bold" (click)="mostrarFormulario = !mostrarFormulario">
      + Nueva Solicitud
    </button>
  </div>

  <!-- Formulario desplegable -->
  <div *ngIf="mostrarFormulario" class="card p-4 mb-4 shadow-sm bg-light">
    <h4>Crear Nueva Solicitud</h4>
    <div class="mb-3">
      <label class="form-label">Tipo de Solicitud</label>
      <input type="text" class="form-control" [(ngModel)]="nuevo.tipo" placeholder="Ej: Donación, Préstamo">
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" [(ngModel)]="nuevo.descripcion" placeholder="Detalles de la solicitud..."></textarea>
    </div>
    <button class="btn btn-primary" (click)="guardarSolicitud()">Guardar Solicitud</button>
  </div>

  <!-- Listado -->
  <div *ngIf="cargando" class="text-center my-5">
    <p>Cargando solicitudes...</p>
  </div>

  <div *ngIf="!cargando" class="row">
    <div class="col-md-4 mb-4" *ngFor="let item of solicitudes">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-primary fw-bold">{{ item.tipo }}</h5>
          <p class="card-text text-secondary">{{ item.descripcion }}</p>
          <hr>
          <p class="mb-0"><small><strong>Usuario ID:</strong> {{ item.usuario_id }}</small></p>
        </div>
      </div>
    </div>
  </div>
</div>
