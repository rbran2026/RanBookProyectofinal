<div class="registro-container">
  <div class="registro-card">
    <h2>Registro en RANBOOK</h2>
    <p>Únete a la red de intercambio académico</p>

    <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      <div class="form-group"><label>Nombre Completo</label><input type="text" formControlName="nombre" class="form-control"></div>
      <div class="form-group"><label>Correo Electrónico</label><input type="email" formControlName="email" class="form-control"></div>
      <div class="form-group"><label>Contraseña</label><input type="password" formControlName="password" class="form-control"></div>
      <div class="form-group"><label>Institución Educativa</label><input type="text" formControlName="institucion" class="form-control"></div>
      <div class="form-group"><label>Ciudad</label><input type="text" formControlName="ciudad" class="form-control"></div>
      <div class="form-group"><label>Teléfono</label><input type="text" formControlName="telefono" class="form-control"></div>

      <button type="submit" [disabled]="isLoading" class="btn-primary">Registrarse</button>
    </form>
    <p class="footer-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
